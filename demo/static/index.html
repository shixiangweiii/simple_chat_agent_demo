    confidencePanel.className = 'confidence-panel';
    confidencePanel.hidden = true;
    $answer.insertAdjacentElement('afterend', confidencePanel);
    const thinkTextNode = document.createTextNode('');
    $thinkBody.appendChild(thinkTextNode);

    const ctx = {
      aiDiv, $think, $thinkBody, $thinkSummary, $toolStrip, $answer, $searchStatus,
      confidencePanel,
      thinkTextNode,
      answerBuf: '', thinkStartTs: 0, answeringFlipped: false, answerStarted: false,
      searchFadeTimer: 0,
      awaitingUser: false,  // 流以 await_user 收尾时置 true,跳过 done 的"(无内容)"占位
      componentSlots: new Map(),  // tool_call_id → component-slot DOM 元素
      uiRenderer: null,
    };
    const uiMount = document.createElement('div');
    uiMount.className = 'ui-surface-mount';
    ctx.$toolStrip.parentNode.insertBefore(uiMount, ctx.$answer);
    ctx.uiRenderer = new DeclarativeRenderer(uiMount);

    ctx.flipToAnswering = function () {
      if (ctx.answeringFlipped) return;
      ctx.answeringFlipped = true;
      if (ctx.thinkStartTs) {
        const elapsed = (Date.now() - ctx.thinkStartTs) / 1000;
        ctx.$think.open = false;
        ctx.$thinkSummary.textContent = `💭 思考过程（用时 ${elapsed.toFixed(1)} s）`;
      }
    };
    ctx.appendAnswer = function (text) {
      if (!ctx.answerStarted) {
        ctx.answerStarted = true;
        ctx.$answer.innerHTML = '';
      }
      ctx.answerBuf += text;
      ctx.$answer.innerHTML = renderMarkdown(ctx.answerBuf);
      scrollToBottom();
    };
    ctx.pushTool = function (label) {
      ctx.$toolStrip.hidden = false;
      const line = document.createElement('div');
      line.className = 'tool-line';
      line.textContent = label;
      ctx.$toolStrip.appendChild(line);
      scrollToBottom();
    };
    ctx.showSearchStatus = function (phase) {
      const map = {
        in_progress: '🔍 联网搜索准备中…',
        searching:   '🔍 正在搜索网络…',
        completed:   '✅ 网络搜索完成',
      };
      const label = map[phase];
      if (!label) return;
      if (ctx.searchFadeTimer) { clearTimeout(ctx.searchFadeTimer); ctx.searchFadeTimer = 0; }
      ctx.$searchStatus.textContent = label;
      ctx.$searchStatus.classList.remove('fading');
      ctx.$searchStatus.classList.add('visible');
      if (phase === 'completed') {
        ctx.searchFadeTimer = setTimeout(() => ctx.$searchStatus.classList.add('fading'), 1500);
      }
      scrollToBottom();
    };
    ctx.clearSearchStatus = function () {
      if (ctx.searchFadeTimer) { clearTimeout(ctx.searchFadeTimer); ctx.searchFadeTimer = 0; }
      ctx.$searchStatus.classList.remove('visible', 'fading');
    };
    ctx.showConfidence = function (data) {
      renderConfidenceSignal(ctx.confidencePanel, data || {});
    };
    return ctx;
  }

  function confidenceLabel(level) {
    return {
      high: '高置信度',
      medium: '中置信度',
      low: '低置信度草稿',
    }[level] || '置信度';
  }

  function renderConfidenceSignal(panel, data) {
    if (!panel) return;
    panel.innerHTML = '';
    panel.hidden = false;
    const level = ['high', 'medium', 'low'].includes(data.level) ? data.level : 'medium';
    const score = typeof data.score === 'number' ? data.score : Number(data.score || 0);

    const row = document.createElement('div');
    row.className = 'confidence-row';
    const badge = document.createElement('span');
    badge.className = `confidence-badge ${level}`;
    badge.textContent = `${confidenceLabel(level)} ${Math.round(Math.max(0, Math.min(1, score)) * 100)}%`;
    row.appendChild(badge);
    const reason = document.createElement('span');
    reason.className = 'confidence-reason';
    reason.textContent = data.reason || '';
    row.appendChild(reason);
    panel.appendChild(row);

    if (data.draft && data.draft_id) {
      const actions = document.createElement('div');
      actions.className = 'confidence-actions';
      const discard = document.createElement('button');
      discard.type = 'button';
      discard.className = 'hitl-btn hitl-reject';
      discard.textContent = '丢弃';
      const accept = document.createElement('button');
      accept.type = 'button';
      accept.className = 'hitl-btn hitl-submit';
      accept.textContent = '采纳';
      const decide = (decision) => {
        sendConfidenceDecision(data.draft_id, decision, panel);
      };
      discard.addEventListener('click', () => decide('discard'));
      accept.addEventListener('click', () => decide('accept'));
      actions.appendChild(discard);
      actions.appendChild(accept);
      panel.appendChild(actions);
    }
    scrollToBottom();
  }

  async function sendConfidenceDecision(draftId, decision, panel) {
    if (!SESSION_ID || !draftId) return;
    const buttons = panel ? panel.querySelectorAll('button') : [];
    buttons.forEach(btn => { btn.disabled = true; });
    try {
      const resp = await fetch('/api/confidence_decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, draft_id: draftId, decision }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const status = document.createElement('div');
      status.className = 'confidence-reason';
      status.textContent = decision === 'accept' ? '已采纳到记忆' : '已丢弃,不会写入记忆';
      if (panel) panel.appendChild(status);
      showToast(decision === 'accept' ? '已采纳草稿' : '已丢弃草稿');
    } catch (e) {
      buttons.forEach(btn => { btn.disabled = false; });
      showToast('处理置信度草稿失败: ' + (e.message || String(e)), true);
    }
  }

  // SSE 流消费循环 —— 共用 dispatch
  async function consumeStream(reader, ctx) {
    const decoder = new TextDecoder();
    let raw = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += decoder.decode(value, { stream: true });
      const blocks = raw.split('\n\n');
      raw = blocks.pop();
      for (const block of blocks) {
        if (!block.trim()) continue;
        const ev = parseSSEBlock(block);
        if (ev.event === 'thinking') {
          if (!ctx.thinkStartTs) {
            ctx.thinkStartTs = Date.now();
            ctx.$think.hidden = false;
            ctx.$think.open = true;
          }
          const piece = (ev.data && ev.data.text) || '';
          if (piece) ctx.thinkTextNode.appendData(piece);
          ctx.$thinkBody.scrollTop = ctx.$thinkBody.scrollHeight;
          scrollToBottom();
        } else if (ev.event === 'chunk') {
          ctx.flipToAnswering();
          ctx.appendAnswer((ev.data && ev.data.text) || '');
        } else if (ev.event === 'status') {
          if (ev.data && ev.data.phase === 'answering') ctx.flipToAnswering();
        } else if (ev.event === 'tool_call') {
          ctx.pushTool(`🛠 调用工具: ${ev.data.name} ${JSON.stringify(ev.data.args)}`);
        } else if (ev.event === 'tool_result') {
          ctx.pushTool(`✓ 工具 ${ev.data.name} 已返回结果`);
        } else if (ev.event === 'component_loading') {
          const slot = document.createElement('div');
          slot.className = 'component-slot';
          slot.dataset.toolCallId = ev.data.tool_call_id;
          const loading = document.createElement('div');
          loading.className = 'component-loading';
          loading.textContent = ev.data.placeholder_text || '加载中…';
          slot.appendChild(loading);
          ctx.$toolStrip.parentNode.insertBefore(slot, ctx.$answer);
          ctx.$toolStrip.hidden = false;
          ctx.componentSlots.set(ev.data.tool_call_id, slot);
          scrollToBottom();
        } else if (ev.event === 'render_component') {
          const slot = ctx.componentSlots.get(ev.data.tool_call_id);
          const renderer = COMPONENT_RENDERERS[ev.data.component_type];
          if (slot && renderer) {
            slot.innerHTML = '';
            slot.appendChild(renderer(ev.data.props));
          } else if (slot) {
            slot.innerHTML = '';
            const pre = document.createElement('pre');
            pre.style.cssText = 'font-size:11px;overflow:auto;padding:8px;background:var(--bg-2);border-radius:6px';
            pre.textContent = JSON.stringify(ev.data.props, null, 2);
            slot.appendChild(pre);
          }
          scrollToBottom();
        } else if (ev.event === 'component_error') {
          const slot = ctx.componentSlots.get(ev.data.tool_call_id);
          if (slot) {
            slot.innerHTML = '';
            slot.appendChild(renderComponentError(ev.data.error_message));
          }
          scrollToBottom();
        } else if (ev.event === 'search_status') {
          ctx.showSearchStatus(ev.data && ev.data.phase);
        } else if (ev.event === 'confidence_signal') {
          ctx.showConfidence(ev.data || {});
        } else if (ev.event === 'ui_hint') {
          applyUiHint(ev.data || {});
        } else if (
          ev.event === 'ui_surface_create' ||
          ev.event === 'ui_surface_update' ||
          ev.event === 'ui_data_update' ||
          ev.event === 'begin_rendering'
        ) {
          ctx.uiRenderer.handleEvent(ev.event, ev.data || {});
          scrollToBottom();
        } else if (ev.event === 'activity_snapshot') {
          upsertPlanCard(ev.data || {});
          scrollToBottom();
        } else if (ev.event === 'activity_delta') {
          applyActivityDelta(ev.data || {});
          scrollToBottom();
        } else if (ev.event === 'steer_applied') {
          // Phase 9a: 服务端确认 steer 已注入 messages, 视觉提示用户
          const msg = (ev.data && ev.data.message) || '';
          const rnd = (ev.data && typeof ev.data.round === 'number') ? ev.data.round : '?';
          appendSystemNote(`✓ 纠偏已注入(round ${rnd}): ${msg}`);
        } else if (ev.event === 'agent_state_snapshot') {
          // Phase 9b: 全局态完整快照, 覆盖 store
          agentStateStore.replace(ev.data || {});
          renderAgentStatePanel();
        } else if (ev.event === 'agent_state_delta') {
          // Phase 9b: JSON Patch 增量
          agentStateStore.applyPatch((ev.data && ev.data.patch) || []);
          renderAgentStatePanel();
        } else if (ev.event === 'await_user') {
          // HITL 中断:渲染 HITL bubble,本流即将结束(后端会紧接着发 done)
          // Phase 9a: 退出 steer 模式 —— 后续 done 会再 setStreaming(false) 恢复 chat
          streamSteerActive = false;
          $send.dataset.mode = 'chat';
          ctx.flipToAnswering();
          ctx.clearSearchStatus();
          ctx.awaitingUser = true;
          addHitlBubble(ev.data || {});
        } else if (ev.event === 'error') {
          ctx.flipToAnswering();
          ctx.clearSearchStatus();
          // 清扫未 resolve 的 component-loading slot
          for (const [, slot] of ctx.componentSlots) {
            if (slot.querySelector('.component-loading')) {
              slot.innerHTML = '';
              slot.appendChild(renderComponentError('发生错误，组件未完成渲染'));
            }
          }
          const msg = (ev.data && ev.data.message) || '未知错误';
          if (!ctx.answerStarted) {
            ctx.answerStarted = true;
            ctx.$answer.innerHTML = `<span class="error-text">⚠ ${escapeHtml(msg)}</span>`;
          } else {
            ctx.answerBuf += `\n\n**⚠ ${msg}**`;
            ctx.$answer.innerHTML = renderMarkdown(ctx.answerBuf);
          }
          scrollToBottom();
        } else if (ev.event === 'done') {
          ctx.clearSearchStatus();
          // 清扫未 resolve 的 component-loading slot(流中断 / 意外结束时防止永久转圈)
          for (const [, slot] of ctx.componentSlots) {
            if (slot.querySelector('.component-loading')) {
              slot.innerHTML = '';
              slot.appendChild(renderComponentError('流已结束，组件未完成渲染'));
            }
          }
          if (ctx.awaitingUser) {
            // HITL 中断态:答复区若为空,不需要"(无内容)"占位 —— 答复在 HITL bubble 之后才会有
            if (!ctx.answerStarted) {
              ctx.$answer.innerHTML = '<span class="thinking-placeholder" style="font-style:italic;">⏸ 等待用户操作…</span>';
            }
          } else if (!ctx.answerStarted) {
            ctx.$answer.innerHTML = '<span class="thinking-placeholder">(无内容)</span>';
          } else {
            renderMermaidIn(ctx.$answer);  // fire-and-forget
          }
        }
      }
    }
  }

  function collectContext() {
    return {
      viewport_width: window.innerWidth,
      selected_text: window.getSelection()?.toString()?.slice(0, 500) || null,
      session_message_count: document.querySelectorAll('.msg.user').length,
    };
  }

  function clearUiHint() {
    const $el = document.getElementById('messages');
    if (!$el) return;
    $el.classList.remove('compact-mode');
    const oldHint = $el.querySelector('.focus-hint');
    if (oldHint) oldHint.remove();
  }

  function applyUiHint(data) {
    const mode = data && data.mode;
    const $el = document.getElementById('messages');
    if (!$el) return;
    clearUiHint();

    if (mode === 'compact') {
      $el.classList.add('compact-mode');
    } else if (mode === 'focus') {
      const hint = document.createElement('div');
      hint.className = 'focus-hint';
      hint.textContent = '针对选中文本回答';
      $el.insertBefore(hint, $el.firstChild);
    }
    // unknown/chat → 仅清除，不做额外操作
  }

  // ============================================================
  // Phase 10a: 图片附件 — base64 data URL 内嵌, 不走文件上传 API
  // ============================================================
  const MAX_IMAGES = 3;
  const MAX_IMAGE_SIZE = 5 * 1024 * 1024; // 5MB 原图
  let attachedImages = []; // string[] of data URLs

  function isAttachDisabled() {
    // 流活跃 / steer 模式 / 语音识别中 → 禁用 attach
    return streamSteerActive || ($send.dataset.mode === 'steer') || recognizing;
  }

  function renderAttachedImages() {
    $attachedImages.innerHTML = '';
    attachedImages.forEach((url, idx) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      const img = document.createElement('img');
      img.src = url;
      img.alt = `附图 ${idx + 1}`;
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.textContent = '✖';
      rm.title = '移除';
      rm.addEventListener('click', () => {
        attachedImages.splice(idx, 1);
        renderAttachedImages();
      });
      div.appendChild(img);
      div.appendChild(rm);
      $attachedImages.appendChild(div);
    });
  }

  async function attachImages(files) {
    if (isAttachDisabled()) return;
    if (!files || !files.length) return;
    for (const file of files) {
      // 数量兜底校验放在 push 前, 防止异步 race 导致超 3
      if (attachedImages.length >= MAX_IMAGES) {
        showToast(`最多附带 ${MAX_IMAGES} 张图片`, true);
        break;
      }
      if (!file.type || !file.type.startsWith('image/')) {
        showToast(`仅支持图片: ${file.name}`, true);
        continue;
      }
      if (file.size > MAX_IMAGE_SIZE) {
        showToast(`图片过大 (>5MB): ${file.name}`, true);
        continue;
      }
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('FileReader 失败'));
          reader.readAsDataURL(file);
        });
        if (attachedImages.length < MAX_IMAGES) {
          attachedImages.push(dataUrl);
        }
      } catch (e) {
        showToast(`读取失败: ${file.name}`, true);
      }
    }
    renderAttachedImages();
  }

  // 三路输入汇入:点击 / 拖拽 / 粘贴 — Phase 10b 扩展为按 file.type 分流
  function dispatchSelectedFiles(fileList) {
    const imgs = [], others = [];
    for (const f of fileList) {
      if (f.type && f.type.startsWith('image/')) imgs.push(f);
      else others.push(f);
    }
    if (imgs.length) attachImages(imgs);
    if (others.length) attachFiles(others);
  }

  $attach.addEventListener('click', () => {
    if (isAttachDisabled()) return;
    $fileInput.click();
  });
  $fileInput.addEventListener('change', (e) => {
    dispatchSelectedFiles(e.target.files);
    e.target.value = ''; // 清 value 保证同一文件可重选
  });
  $inputBar.addEventListener('dragover', (e) => {
    if (isAttachDisabled()) return;
    e.preventDefault();
    $inputBar.classList.add('drag-over');
  });
  $inputBar.addEventListener('dragleave', () => {
    $inputBar.classList.remove('drag-over');
  });
  $inputBar.addEventListener('drop', (e) => {
    e.preventDefault();
    $inputBar.classList.remove('drag-over');
    if (isAttachDisabled()) return;
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      dispatchSelectedFiles(e.dataTransfer.files);
    }
  });
  // paste 保持仅图片: 文本粘贴走 textarea, 文件从剪贴板粘没有 UX 意义
  document.addEventListener('paste', (e) => {
    if (isAttachDisabled()) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const it of items) {
      if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) attachImages(files);
  });

  // ============================================================
  // Phase 10b: 文本文件附件 — 与 attachImages 并行的独立路径
  // ============================================================
  const MAX_FILES = 5;
  const MAX_FILE_BYTES = 100 * 1024;      // 与后端 MAX_ATTACHMENT_HARD_CHARS 对齐; >20KB 由后端软截断
  const MAX_TOTAL_FILE_BYTES = 100 * 1024;
  const ALLOWED_FILE_EXTS = new Set([
    '.txt','.md','.py','.js','.ts','.json','.csv','.xml',
    '.html','.css','.yaml','.yml','.sh','.go','.rs','.java',
    '.c','.cpp','.h',
  ]);
  // 浏览器对很多扩展返回空 file.type, 此处做 mime 兜底
  const EXT_TO_MIME = {
    '.py':'text/x-python', '.md':'text/markdown', '.csv':'text/csv',
    '.json':'application/json', '.xml':'application/xml',
    '.yaml':'application/x-yaml', '.yml':'application/x-yaml',
    '.js':'application/javascript', '.ts':'application/typescript',
    '.html':'text/html', '.css':'text/css', '.sh':'text/x-shellscript',
    '.go':'text/x-go', '.rs':'text/x-rust', '.java':'text/x-java',
    '.c':'text/x-c', '.cpp':'text/x-c++', '.h':'text/x-c',
    '.txt':'text/plain',
  };
  let attachedFiles = [];  // {filename, content, mime_type, size}[]

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    return (bytes / 1024).toFixed(1) + 'KB';
  }

  async function attachFiles(files) {
    if (isAttachDisabled()) return;
    if (!files || !files.length) return;
    let totalBytes = attachedFiles.reduce((s, f) => s + f.size, 0);
    for (const file of files) {
      if (attachedFiles.length >= MAX_FILES) {
        showToast(`最多附带 ${MAX_FILES} 个文件`, true); break;
      }
      const dotIdx = file.name.lastIndexOf('.');
      const ext = dotIdx >= 0 ? file.name.slice(dotIdx).toLowerCase() : '';
      if (!ALLOWED_FILE_EXTS.has(ext)) {
        showToast(`不支持的文件类型: ${file.name}`, true); continue;
      }
      if (file.size > MAX_FILE_BYTES) {
        showToast(`文件过大 (>${formatSize(MAX_FILE_BYTES)}): ${file.name}`, true); continue;
      }
      if (totalBytes + file.size > MAX_TOTAL_FILE_BYTES) {
        showToast(`总量超 ${formatSize(MAX_TOTAL_FILE_BYTES)}，跳过 ${file.name}`, true); continue;
      }
      try {
        const content = await file.text();  // UTF-8
        attachedFiles.push({
          filename: file.name,
          content,
          mime_type: file.type || EXT_TO_MIME[ext] || 'text/plain',
          size: file.size,
        });
        totalBytes += file.size;
      } catch (e) { showToast(`读取失败: ${file.name}`, true); }
    }
    renderAttachedFiles();
  }

  function renderAttachedFiles() {
    $attachedFiles.innerHTML = '';
    attachedFiles.forEach((f, idx) => {
      const chip = document.createElement('span');
      chip.className = 'file-chip';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = f.filename;
      chip.appendChild(nameSpan);
      const sizeSpan = document.createElement('span');
      sizeSpan.className = 'size';
      sizeSpan.textContent = formatSize(f.size);
      chip.appendChild(sizeSpan);
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.textContent = '✖';
      rm.title = '移除';
      rm.addEventListener('click', () => {
        attachedFiles.splice(idx, 1);
        renderAttachedFiles();
      });
      chip.appendChild(rm);
      $attachedFiles.appendChild(chip);
    });
  }

  // ============================================================
  // Phase 10c: 语音输入 — 纯前端 Web Speech API
  // ============================================================
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognizing = false;
  let interimNode = null;

  if (SR) {
    $mic.style.display = '';
    $mic.addEventListener('click', toggleVoice);
  }

  function toggleVoice() {
    if (isAttachDisabled()) return;
    if (recognizing) { recognition && recognition.stop(); return; }
    if (!recognition) {
      recognition = new SR();
      recognition.lang = navigator.language || 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = onSpeechResult;
      recognition.onend = onSpeechEnd;
      recognition.onerror = onSpeechError;
    }
    try {
      recognition.start();
      recognizing = true;
      $mic.classList.add('recording');
      $mic.textContent = '⏹';
      showInterimNode('');
    } catch (e) {
      // Safari/Firefox 部分支持 → 失败惰性 hide
      $mic.style.display = 'none';
      showToast('语音识别不可用', true);
    }
  }

  function onSpeechResult(e) {
    let interim = '', finalText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t;
      else interim += t;
    }
    if (interim) showInterimNode(interim);
    if (finalText) {
      $input.value = ($input.value || '') + finalText;
      autoResize();
      showInterimNode('');
    }
  }

  function onSpeechEnd() {
    recognizing = false;
    $mic.classList.remove('recording');
    $mic.textContent = '🎤';
    showInterimNode('');
  }

  function onSpeechError(e) {
    showToast(`语音识别失败: ${e.error || 'unknown'}`, true);
    onSpeechEnd();
  }

  function showInterimNode(text) {
    if (!interimNode) {
      interimNode = document.createElement('div');
      interimNode.className = 'voice-interim';
      $inputBar.parentElement.insertBefore(interimNode, $inputBar);
    }
    interimNode.textContent = text;
    interimNode.style.display = text ? '' : 'none';
  }
  async function send() {
    const text = $input.value.trim();
    if (!text && !attachedImages.length && !attachedFiles.length) return;
    // Phase 9a: 流活跃 + steer 模式 → POST /api/steer (steer 仅文本, 不带图)
    if ($send.dataset.mode === 'steer' && streamSteerActive) {
      if (!text) { showToast('纠偏指令不能为空', true); return; }
      return sendSteer(text);
    }
    if (!canStartStream('聊天')) return;
    if (!SESSION_ID) { showToast('会话未就绪,请稍候', true); return; }

    // Phase 10c fix: 停止活跃的语音识别, 防止残音泄漏到下一轮
    if (recognizing && recognition) recognition.stop();

    // Phase 10a: 发送瞬间快照 images, 然后立即清空本地状态防止重发
    const imagesSnapshot = attachedImages.slice();
    attachedImages = [];
    renderAttachedImages();
    // Phase 10b: 同纲领快照 attachedFiles
    const filesSnapshot = attachedFiles.slice();
    attachedFiles = [];
    renderAttachedFiles();

    const context = collectContext();
    clearUiHint();
    // 用户气泡: 文本 + 缩略图条 (展示用) + 文件 chip 条
    const userHtml = text ? escapeHtml(text).replace(/\n/g, '<br>') : '';
    const placeholder = text
      || [imagesSnapshot.length && '[图片]', filesSnapshot.length && '[文件]']
           .filter(Boolean).join(' + ')
      || '';
    const userBubble = addMessage('user', userHtml, placeholder);
    if (imagesSnapshot.length) {
      const stripe = document.createElement('div');
      stripe.className = 'attached-images';
      stripe.style.padding = '6px 0 0';
      imagesSnapshot.forEach((url, idx) => {
        const div = document.createElement('div');
        div.className = 'thumb';
        const img = document.createElement('img');
        img.src = url;
        img.alt = `附图 ${idx + 1}`;
        div.appendChild(img);
        stripe.appendChild(div);
      });
      userBubble.appendChild(stripe);
    }
    if (filesSnapshot.length) {
      const strip = document.createElement('div');
      strip.className = 'attached-files';
      strip.style.padding = '6px 0 0';
      filesSnapshot.forEach((f) => {
        const chip = document.createElement('span');
        chip.className = 'file-chip';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = `📄 ${f.filename}`;
        chip.appendChild(name);
        const sz = document.createElement('span');
        sz.className = 'size';
        sz.textContent = formatSize(f.size);
        chip.appendChild(sz);
        strip.appendChild(chip);
      });
      userBubble.appendChild(strip);
    }
    $input.value = '';
    autoResize();
    setStreaming(true);

    const ctx = createAiStreamContext();
    try {
      const body = { session_id: SESSION_ID, message: text, context };
      if (imagesSnapshot.length) body.images = imagesSnapshot;
      if (filesSnapshot.length) {
        // 后端不需要 size 字段; 仅传 filename/content/mime_type
        body.attachments = filesSnapshot.map(f => ({
          filename: f.filename, content: f.content, mime_type: f.mime_type,
        }));
      }
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok || !resp.body) {
        // Phase 10a/10b: 尝试读 detail (后端 *PayloadInvalid 等 400 返回结构化错误)
        let detail = `HTTP ${resp.status}`;
        try {
          const errJson = await resp.json();
          if (errJson && errJson.detail) detail = errJson.detail;
        } catch (_) {}
        throw new Error(detail);
      }
      await consumeStream(resp.body.getReader(), ctx);
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      ctx.flipToAnswering();
      ctx.$answer.innerHTML = `<span class="error-text">⚠ 网络错误: ${escapeHtml(msg)}</span>`;
    } finally {
      setStreaming(false);
      $input.focus();
    }
  }

  // Phase 9a: 发送纠偏指令到 /api/steer。立即返回, 不启 SSE 流;
  // 本地在聊天区追加一个 user-style "纠偏" 气泡作为视觉反馈, 实际生效由
  // 当前流的下一轮 steer_applied 事件确认 (consumeStream 会插一条 system note)。
  async function sendSteer(message) {
    if (!SESSION_ID) { showToast('会话未就绪', true); return; }
    $input.value = '';
    autoResize();
    addMessage('user', `<span class="steer-tag">[纠偏]</span> ${escapeHtml(message).replace(/\n/g, '<br>')}`, `[纠偏] ${message}`);
    try {
      const resp = await fetch('/api/steer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, message }),
      });
      if (!resp.ok) {
        let detail = `HTTP ${resp.status}`;
        try {
          const data = await resp.json();
          if (data && data.detail) detail = String(data.detail);
        } catch (_) { /* ignore */ }
        showToast('Steer 失败: ' + detail, true);
        return;
      }
      showToast('已发送纠偏指令,下一轮生效', false);
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      showToast('Steer 网络错误: ' + msg, true);
    } finally {
      $input.focus();
    }
  }

  async function sendUiAction(surfaceId, comp, btn, surface) {
    if (!SESSION_ID) { showToast('会话未就绪,无法执行 action', true); return; }
    if (!canStartStream('UI action')) return;
    const action = comp && comp.action && typeof comp.action === 'object' ? comp.action : null;
    const eventName = action && typeof action.event_name === 'string' ? action.event_name : '';
    if (!surfaceId || !comp || !comp.id || !eventName) {
      showToast('UI action 信息不完整', true);
      return;
    }

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '处理中...';
    setStreaming(true);
    const ctx = createAiStreamContext();
    try {
      const resp = await fetch('/api/ui_action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: SESSION_ID,
          surface_id: surfaceId,
          component_id: comp.id,
          event_name: eventName,
          // Phase 8b: 表单数据快照 —— 让模型直接读取用户填写的表单字段。
          // surface 可能为空(老的不传 surface 的 button 调用兼容);后端字段也是 Optional。
          form_data: (surface && surface.data) ? surface.data : {},
        }),
      });
      if (!resp.ok || !resp.body) {
        let detail = `HTTP ${resp.status}`;
        try { const j = await resp.json(); if (j && j.detail) detail += ` ${j.detail}`; } catch (e) { /* noop */ }
        throw new Error(detail);
      }
      await consumeStream(resp.body.getReader(), ctx);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = originalText;
      const msg = e && e.message ? e.message : String(e);
      ctx.flipToAnswering();
      ctx.$answer.innerHTML = `<span class="error-text">⚠ UI action 失败: ${escapeHtml(msg)}</span>`;
      showToast('UI action 失败: ' + msg, true);
    } finally {
      setStreaming(false);
      if (btn.isConnected && btn.disabled) btn.textContent = originalText;
      $input.focus();
    }
  }

  function planStatusIcon(status) {
    return {
      pending: '○',
      running: '●',
      done: '✓',
      error: '!',
      skipped: '↷',
      waiting: '…',
    }[status] || '○';
  }

  function buildPlanStepRow(step, editable) {
    const row = document.createElement('div');
    row.className = `plan-step ${step.status || 'pending'}`;
    row.dataset.stepId = step.id || '';

    const icon = document.createElement('span');
    icon.className = 'plan-step-icon';
    icon.textContent = planStatusIcon(step.status);
    row.appendChild(icon);

    const input = document.createElement('input');
    input.className = 'plan-step-title';
    input.value = step.title || '';
    input.disabled = !editable;
    input.setAttribute('aria-label', '计划步骤');
    row.appendChild(input);

    const actions = document.createElement('div');
    actions.className = 'plan-step-actions';
    for (const [label, action] of [['↑', 'up'], ['↓', 'down'], ['×', 'delete']]) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'plan-mini-btn';
      btn.textContent = label;
      btn.dataset.action = action;
      btn.disabled = !editable;
      actions.appendChild(btn);
    }
    row.appendChild(actions);
    return row;
  }

  function collectPlanSteps(card) {
    if (!card) return [];
    return Array.from(card.querySelectorAll('.plan-step')).map((row, idx) => {
      const input = row.querySelector('.plan-step-title');
      return {
        id: row.dataset.stepId || `s${idx + 1}`,
        title: (input && input.value.trim()) || `步骤 ${idx + 1}`,
      };
    }).filter(step => step.title);
  }

  function attachPlanStepEditing(stepsEl) {
    stepsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.plan-mini-btn');
      if (!btn) return;
      const row = btn.closest('.plan-step');
      if (!row) return;
      if (btn.dataset.action === 'delete') {
        row.remove();
      } else if (btn.dataset.action === 'up' && row.previousElementSibling) {
        stepsEl.insertBefore(row, row.previousElementSibling);
      } else if (btn.dataset.action === 'down' && row.nextElementSibling) {
        stepsEl.insertBefore(row.nextElementSibling, row);
      }
    });
  }

  function buildPlanAddRow(stepsEl) {
    const addRow = document.createElement('div');
    addRow.className = 'plan-add-row';
    const addInput = document.createElement('input');
    addInput.className = 'plan-add-input';
    addInput.placeholder = '新增步骤';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'hitl-btn hitl-submit';
    addBtn.textContent = '新增';
    addBtn.addEventListener('click', () => {
      const title = addInput.value.trim();
      if (!title) { addInput.focus(); return; }
      stepsEl.appendChild(buildPlanStepRow({ id: `s${stepsEl.children.length + 1}`, title, status: 'pending' }, true));
      addInput.value = '';
    });
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    return addRow;
  }

  function buildEditablePlanSteps(steps) {
    const editor = document.createElement('div');
    editor.className = 'plan-card plan-decision-editor';
    const stepsEl = document.createElement('div');
    stepsEl.className = 'plan-steps';
    for (const step of Array.isArray(steps) ? steps : []) {
      stepsEl.appendChild(buildPlanStepRow(step, true));
    }
    editor.appendChild(stepsEl);
    attachPlanStepEditing(stepsEl);
    editor.appendChild(buildPlanAddRow(stepsEl));
    return editor;
  }

  function renderPlanCard(card, data, editable) {
    card.innerHTML = '';
    card.dataset.planId = data.plan_id || card.dataset.planId || '';
    card.dataset.editable = editable ? '1' : '0';

    const wrap = document.createElement('div');
    wrap.className = 'plan-card';
    const title = document.createElement('div');
    title.className = 'plan-title';
    title.textContent = data.title || '执行计划';
    wrap.appendChild(title);

    const stepsEl = document.createElement('div');
    stepsEl.className = 'plan-steps';
    for (const step of Array.isArray(data.steps) ? data.steps : []) {
      stepsEl.appendChild(buildPlanStepRow(step, editable));
    }
    wrap.appendChild(stepsEl);

    if (editable) {
      attachPlanStepEditing(stepsEl);
      wrap.appendChild(buildPlanAddRow(stepsEl));
    }

    const actions = document.createElement('div');
    actions.className = 'hitl-actions';
    if (editable) {
      const confirm = document.createElement('button');
      confirm.type = 'button';
      confirm.className = 'hitl-btn hitl-submit';
      confirm.textContent = '确认并执行';
      confirm.addEventListener('click', () => {
        if (!canStartStream('计划执行')) return;
        const steps = collectPlanSteps(card);
        if (steps.length === 0) { showToast('至少保留一个步骤', true); return; }
        card.querySelectorAll('button, input').forEach(el => { el.disabled = true; });
        if (currentHitlBubble === card) currentHitlBubble = null;
        consumePlanConfirmStream({ plan_id: card.dataset.planId, steps });
      });
      actions.appendChild(confirm);
    } else if (data.continuable) {
      const cont = document.createElement('button');
      cont.type = 'button';
      cont.className = 'hitl-btn hitl-submit';
      cont.textContent = '继续执行';
      cont.addEventListener('click', () => {
        if (!canStartStream('计划继续执行')) return;
        card.querySelectorAll('button').forEach(el => { el.disabled = true; });
        consumePlanContinueStream({ plan_id: card.dataset.planId });
      });
      actions.appendChild(cont);
    }
    wrap.appendChild(actions);
    card.appendChild(wrap);
  }

  function upsertPlanCard(data) {
    if (!data.plan_id) return;
    const $emptyEl = document.getElementById('empty');
    if ($emptyEl) $emptyEl.remove();
    let card = PLAN_CARDS.get(data.plan_id);
    if (!card) {
      card = document.createElement('div');
      card.className = 'msg hitl';
      PLAN_CARDS.set(data.plan_id, card);
      $messages.appendChild(card);
    }
    renderPlanCard(card, data, !!data.editable);
    if (data.editable) currentHitlBubble = card;
  }

  function applyActivityDelta(data) {
    const card = data && data.plan_id ? PLAN_CARDS.get(data.plan_id) : null;
    if (!card) return;
    for (const patch of Array.isArray(data.patch) ? data.patch : []) {
      const m = /^\/steps\/(\d+)\/(status|result_summary|error_message)$/.exec(patch.path || '');
      if (!m) continue;
      const idx = Number(m[1]);
      const field = m[2];
      const row = card.querySelectorAll('.plan-step')[idx];
      if (!row) continue;
      if (field === 'status') {
        row.className = `plan-step ${patch.value || 'pending'}`;
        const icon = row.querySelector('.plan-step-icon');
        if (icon) icon.textContent = planStatusIcon(patch.value);
      } else if (field === 'error_message' && patch.value) {
        let err = row.querySelector('.plan-error');
        if (!err) {
          err = document.createElement('div');
          err.className = 'plan-error';
          row.appendChild(err);
        }
        err.textContent = String(patch.value);
      }
    }
  }

  async function consumePlanConfirmStream(body) {

  }

  function addPlanDecisionBubble(payload) {
    const div = document.createElement('div');
    div.className = 'msg hitl';
    const header = document.createElement('div');
    header.className = 'hitl-header';
    header.textContent = (payload.error_message && payload.error_message.includes('中断'))
      ? '计划因服务重启被中断' : '计划步骤需要处理';
    div.appendChild(header);

    const msg = document.createElement('div');
    msg.className = 'hitl-question';
    msg.textContent = payload.error_message || '步骤执行失败';
    div.appendChild(msg);

    const editor = buildEditablePlanSteps(payload.steps || []);
    div.appendChild(editor);

    // Phase 7a M3: 为 update 操作添加编辑指引
    const hint = document.createElement('span');
    hint.style.cssText = 'color:#999;font-size:12px;display:block;margin-bottom:6px';
    hint.textContent = '请先编辑步骤，然后点击确认';
    div.appendChild(hint);

    const actions = document.createElement('div');
    actions.className = 'hitl-actions';
    const makeBtn = (label, decision) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = decision === 'skip' ? 'hitl-btn hitl-reject' : 'hitl-btn hitl-submit';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (!canStartStream('计划恢复')) return;
        if (decision === 'update') {
          // Phase 7a M3: update 操作延迟 markHitlResolved,保留编辑器可编辑
          actions.querySelectorAll('button').forEach(b => { b.disabled = true; });
          hint.textContent = '正在提交修改...';
          consumePlanDecisionStream({
            plan_id: payload.plan_id,
            step_id: payload.step_id,
            decision,
            steps: collectPlanSteps(editor),
          }).then(() => {
            markHitlResolved(div, '已修改');
          }).catch(() => {
            // 失败时恢复按钮
            actions.querySelectorAll('button').forEach(b => { b.disabled = false; });
            hint.textContent = '提交失败，请重试';
          });
        } else {
          markHitlResolved(div, label);
          consumePlanDecisionStream({
            plan_id: payload.plan_id,
            step_id: payload.step_id,
            decision,
            steps: null,
          });
        }
      });
      return btn;
    };
    actions.appendChild(makeBtn('跳过', 'skip'));
    actions.appendChild(makeBtn('重试', 'retry'));
    actions.appendChild(makeBtn('修改后继续', 'update'));
    div.appendChild(actions);
    $messages.appendChild(div);
    currentHitlBubble = div;
    scrollToBottom(true);
  }

  // ---------- HITL bubble ----------
  function addHitlBubble(payload) {
    if (payload.kind === 'plan') {
      upsertPlanCard({
        plan_id: payload.plan_id,
        title: payload.title,
        steps: payload.steps,
        editable: true,
        status: 'pending_confirmation',
      });
      return;
    }
    if (payload.kind === 'plan_decision') {
      addPlanDecisionBubble(payload);
      return;
    }
    const $emptyEl = document.getElementById('empty');
    if ($emptyEl) $emptyEl.remove();
    const div = document.createElement('div');
    div.className = 'msg hitl';
    div.dataset.toolCallId = payload.tool_call_id || '';
    div.dataset.kind = payload.kind || '';

    const args = payload.args || {};
    const isInput = payload.kind === 'input';

    // 头部:工具图标 + 标签 + "已处理" tag 占位
    const header = document.createElement('div');
    header.className = 'hitl-header';
    header.innerHTML = `${isInput ? '💬' : '⚠️'} <span>${isInput ? '需要你的回答' : '需要你的审批'}</span><span class="hitl-resolved-tag"></span>`;
    div.appendChild(header);

    if (isInput) {
      // ask_user:question + 可选 options chip + textarea + 提交按钮
      const q = document.createElement('div');
      q.className = 'hitl-question';
      q.textContent = args.question || '(无问题文本)';
      div.appendChild(q);

      const textarea = document.createElement('textarea');
      textarea.className = 'hitl-input';
      textarea.placeholder = '在此输入答复…(Cmd/Ctrl+Enter 提交)';

      const opts = Array.isArray(args.options) ? args.options : [];
      if (opts.length > 0) {
        const optsWrap = document.createElement('div');
        optsWrap.className = 'hitl-options';
        for (const o of opts) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'hitl-opt';
          chip.textContent = String(o);
          chip.addEventListener('click', () => {
            textarea.value = String(o);
            textarea.focus();
          });
          optsWrap.appendChild(chip);
        }
        div.appendChild(optsWrap);
      }
      div.appendChild(textarea);

      const actions = document.createElement('div');
      actions.className = 'hitl-actions';
      const submit = document.createElement('button');
      submit.type = 'button';
      submit.className = 'hitl-btn hitl-submit';
      submit.textContent = '提交答复';
      submit.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        const answer = textarea.value.trim();
        if (!answer) { textarea.focus(); return; }
        markHitlResolved(div, `已答复: ${answer.slice(0, 40)}${answer.length > 40 ? '…' : ''}`);
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'answer',
          answer,
        });
      });
      actions.appendChild(submit);
      div.appendChild(actions);

      textarea.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          submit.click();
        }
      });
      setTimeout(() => textarea.focus(), 0);
    } else {
      // execute_shell_command:命令 + 理由 + 同意/拒绝
      if (args.command) {
        const cmd = document.createElement('div');
        cmd.className = 'hitl-command';
        cmd.textContent = args.command;
        div.appendChild(cmd);
      }
      if (args.reason) {
        const reason = document.createElement('div');
        reason.className = 'hitl-reason';
        reason.textContent = `理由: ${args.reason}`;
        div.appendChild(reason);
      }

      // 可选拒绝理由 textarea(隐藏的,点拒绝时若想填可见)
      const rejectReason = document.createElement('textarea');
      rejectReason.className = 'hitl-input';
      rejectReason.placeholder = '可选:拒绝理由(模型会看到)';
      rejectReason.style.minHeight = '40px';
      div.appendChild(rejectReason);

      const actions = document.createElement('div');
      actions.className = 'hitl-actions';
      const approve = document.createElement('button');
      approve.type = 'button';
      approve.className = 'hitl-btn hitl-approve';
      approve.textContent = '✓ 同意执行';
      approve.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        markHitlResolved(div, '已同意');
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'approve',
          answer: null,
        });
      });
      const reject = document.createElement('button');
      reject.type = 'button';
      reject.className = 'hitl-btn hitl-reject';
      reject.textContent = '✗ 拒绝';
      reject.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        const reason = rejectReason.value.trim() || null;
        markHitlResolved(div, '已拒绝');
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'reject',
          answer: reason,
        });
      });
      actions.appendChild(reject);
      actions.appendChild(approve);
      div.appendChild(actions);
    }

    $messages.appendChild(div);
    currentHitlBubble = div;
    scrollToBottom(true);
  }

  // ---------- 首屏初始化 ----------
  async function fetchHealth() {
    // Phase 9a + Step 10: 从 /api/health 读 api_mode, 决定 steerable 默认值
    try {
      const resp = await fetch('/api/health');
      if (!resp.ok) return;
      const data = await resp.json();
      if (data && typeof data.api_mode === 'string') {
        API_MODE_CACHE = data.api_mode;
      }
    } catch (e) { /* keep default 'chat' */ }
  }

  async function init() {
    await fetchHealth();
    const stored = localStorage.getItem('sid');
    if (stored) {
      SESSION_ID = stored;
    } else {
      // 没缓存:看看 server 有没有归档,有就选最新一条;否则生成新 UUID
      let items = [];
      try {
        const resp = await fetch('/api/sessions');
        if (resp.ok) items = await resp.json();
      } catch (e) { /* 网络错就当作没归档 */ }
      if (items.length > 0) {
        SESSION_ID = items[0].session_id;
      } else {
        SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
      }
      localStorage.setItem('sid', SESSION_ID);
    }
    updateHeaderSid();
    clearAnchors();  // 兜底空态:loadHistory 内部分支会再次清/重建,无副作用
    await loadSessions();
    await loadHistory(SESSION_ID);
    $input.focus();
  }

  // ---------- 归档预览 modal ----------
  const $previewArchive       = document.getElementById('preview-archive');
  const $archiveModal         = document.getElementById('archive-modal');
  const $archiveModalSid      = document.getElementById('archive-modal-sid');
  const $archiveModalMeta     = document.getElementById('archive-modal-meta');
  const $archiveModalBody     = document.getElementById('archive-modal-body');
  const $archivePaneRendered  = document.getElementById('archive-pane-rendered');
  const $archivePaneSource    = document.getElementById('archive-pane-source');
  const $archiveSourceCode    = document.getElementById('archive-source-code');
  const $archiveModalClose    = document.getElementById('archive-modal-close');
  const $archiveModalCopy     = document.getElementById('archive-modal-copy');
  const $archiveModalDownload = document.getElementById('archive-modal-download');
  const $archiveModalTabs     = $archiveModal.querySelectorAll('.modal-tab');

  // Phase 11: 长期记忆面板 refs
  const $memoryBtn         = document.getElementById('memory');
  const $memoryModal       = document.getElementById('memory-modal');
  const $memoryModalMeta   = document.getElementById('memory-modal-meta');
  const $memoryPane        = document.getElementById('memory-pane');
  const $memoryModalClose  = document.getElementById('memory-modal-close');
  const $memoryModalRefresh= document.getElementById('memory-modal-refresh');
  let memoryPrevFocus = null;

  let archiveModalRaw = '';
  let archivePrevFocus = null;

  const ARCHIVE_META_RE = /^<!-- (session_id|updated_at|turns|preview): (.*?) -->\s*$/;
  const ARCHIVE_TURN_RE = /^<!-- turn: (用户|AI) -->\s*$/gm;

  function parseArchiveMarkdown(raw) {
    // 头部:第一个空行前的连续 HTML 注释为元信息
    const meta = {};
    for (const line of raw.split('\n')) {
      if (line.trim() === '') break;
      const m = line.match(ARCHIVE_META_RE);
      if (m) meta[m[1]] = m[2];
    }
    // turn 段:整行匹配 <!-- turn: 用户|AI -->,段落是相邻两个 turn header 之间的内容
    ARCHIVE_TURN_RE.lastIndex = 0;
    const matches = [];
    let mm;
    while ((mm = ARCHIVE_TURN_RE.exec(raw)) !== null) {
      matches.push({ role: mm[1], headerEnd: mm.index + mm[0].length, headerStart: mm.index });
    }
    const turns = [];
    for (let i = 0; i < matches.length; i++) {
      const start = matches[i].headerEnd;
      const end = i + 1 < matches.length ? matches[i + 1].headerStart : raw.length;
      const content = raw.slice(start, end).trim();
      if (content) turns.push({ role: matches[i].role, content });
    }
    return { meta, turns };
  }

  function renderArchive(raw) {
    const { meta, turns } = parseArchiveMarkdown(raw);
    $archivePaneRendered.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'archive-meta-card';
    for (const [k, v] of [
      ['session_id', meta.session_id || '-'],
      ['updated_at', meta.updated_at || '-'],
      ['turns',      meta.turns      || '0'],
    ]) {
      const span = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + ':';
      span.appendChild(b);
      span.appendChild(document.createTextNode(' ' + v));
      card.appendChild(span);
    }
    $archivePaneRendered.appendChild(card);
    for (const t of turns) {
      const article = document.createElement('article');
      article.className = 'archive-turn ' + (t.role === '用户' ? 'archive-turn-user' : 'archive-turn-ai');
      const h = document.createElement('h3');
      h.textContent = t.role;
      article.appendChild(h);
      const body = document.createElement('div');
      body.className = 'archive-content';
      if (t.role === '用户') {
        // 用户原文不走 markdown,与聊天主区行为一致(防 XSS)
        const p = document.createElement('div');
        p.className = 'archive-user-text';
        p.textContent = t.content;
        body.appendChild(p);
      } else {
        body.innerHTML = renderMarkdown(t.content);
      }
      article.appendChild(body);
      $archivePaneRendered.appendChild(article);
    }
    renderMermaidIn($archivePaneRendered);  // 渲染 Tab 内的 mermaid 块异步替换为 SVG
    $archiveSourceCode.textContent = raw;
    const sid = meta.session_id || SESSION_ID || '';
    $archiveModalSid.textContent = sid.slice(0, 8) || '-';
    $archiveModalSid.title = sid;
    $archiveModalMeta.textContent = `轮数 ${meta.turns || 0} · 更新 ${meta.updated_at || '?'}`;
  }

  function renderArchiveEmptyState() {
    $archivePaneRendered.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'archive-empty';
    const p = document.createElement('p');
    p.textContent = '本会话尚未归档,暂无可预览的 markdown 文件。';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reset-btn';
    btn.textContent = '立即归档';
    btn.addEventListener('click', async () => {
      await archiveCurrent();
      await openArchivePreview();
    });
    div.appendChild(p);
    div.appendChild(btn);
    $archivePaneRendered.appendChild(div);
    $archiveSourceCode.textContent = '';
    $archiveModalSid.textContent = (SESSION_ID || '').slice(0, 8) || '-';
    $archiveModalSid.title = SESSION_ID || '';
    $archiveModalMeta.textContent = '尚未归档';
  }

  function switchArchiveTab(tab) {
    for (const t of $archiveModalTabs) t.classList.toggle('active', t.dataset.tab === tab);
    $archivePaneRendered.hidden = (tab !== 'rendered');
    $archivePaneSource.hidden   = (tab !== 'source');
    $archiveModalBody.scrollTop = 0;
  }

  async function openArchivePreview() {
    if (!SESSION_ID) { showToast('会话未就绪', true); return; }
    let raw = '', archived = false;
    try {
      const resp = await fetch(`/api/sessions/${encodeURIComponent(SESSION_ID)}/raw`);
      if (resp.status === 404)      archived = false;
      else if (!resp.ok)            throw new Error(`HTTP ${resp.status}`);
      else { raw = await resp.text(); archived = true; }
    } catch (e) {
      showToast('加载归档失败: ' + e.message, true);
      return;
    }
    archiveModalRaw = raw;
    if (archived) renderArchive(raw); else renderArchiveEmptyState();
    switchArchiveTab('rendered');
    archivePrevFocus = document.activeElement;
    $archiveModal.hidden = false;
    document.body.classList.add('modal-open');
    $archiveModalClose.focus();
  }

  function closeArchivePreview() {
    $archiveModal.hidden = true;
    document.body.classList.remove('modal-open');
    if (archivePrevFocus && archivePrevFocus.focus) archivePrevFocus.focus();
  }

  $previewArchive.addEventListener('click', openArchivePreview);
  $archiveModalClose.addEventListener('click', closeArchivePreview);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$archiveModal.hidden) closeArchivePreview();
  });
  for (const t of $archiveModalTabs) {
    t.addEventListener('click', () => switchArchiveTab(t.dataset.tab));
  }
  $archiveModalCopy.addEventListener('click', async () => {
    if (!archiveModalRaw) { showToast('暂无内容可复制', true); return; }
    try { await navigator.clipboard.writeText(archiveModalRaw); showToast('已复制源文件'); }
    catch (e) { showToast('复制失败', true); }
  });
  $archiveModalDownload.addEventListener('click', () => {
    if (!archiveModalRaw) { showToast('暂无内容可下载', true); return; }
    const blob = new Blob([archiveModalRaw], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(SESSION_ID || 'session').slice(0, 8)}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 200);
  });

  // ---------- Phase 11: 跨会话长期记忆面板 ----------
  const LTM_CAT_LABELS = { preference: '偏好', identity: '身份', project: '项目', fact: '事实' };
  const LTM_CAT_ORDER = ['preference', 'identity', 'project', 'fact'];

  function renderMemoryFacts(snapshot) {
    $memoryPane.innerHTML = '';
    const facts = (snapshot && Array.isArray(snapshot.facts)) ? snapshot.facts : [];
    $memoryModalMeta.textContent = `共 ${facts.length} 条`;
    if (facts.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'ltm-empty';
      empty.textContent = '还没有跨会话记忆。归档几次对话后，关于你的事实会自动沉淀在这里。';
      $memoryPane.appendChild(empty);
      return;
    }
    // 按 category 分组（已知顺序在前，未知归到末尾）
    const groups = new Map();
    for (const f of facts) {
      const cat = LTM_CAT_LABELS[f.category] ? f.category : '_other';
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(f);
    }
    const orderedCats = [...LTM_CAT_ORDER.filter(c => groups.has(c)), ...(groups.has('_other') ? ['_other'] : [])];
    for (const cat of orderedCats) {
      const group = document.createElement('div');
      group.className = 'ltm-group';
      const title = document.createElement('div');
      title.className = 'ltm-group-title';
      title.textContent = LTM_CAT_LABELS[cat] || '其它';
      group.appendChild(title);
      for (const f of groups.get(cat)) {
        const row = document.createElement('div');
        row.className = 'ltm-fact';
        const body = document.createElement('div');
        body.className = 'ltm-fact-body';
        const text = document.createElement('div');
        text.className = 'ltm-fact-text';
        text.textContent = f.text || '';   // 用户派生内容：textContent，不过 markdown（XSS 边界）
        const meta = document.createElement('div');
        meta.className = 'ltm-fact-meta';
        const nSrc = Array.isArray(f.source_sessions) ? f.source_sessions.length : 0;
        meta.textContent = `更新于 ${(f.updated_at || '').replace('T', ' ').slice(0, 16)} · 来自 ${nSrc} 个会话`;
        body.appendChild(text); body.appendChild(meta);
        const del = document.createElement('button');
        del.className = 'ltm-fact-del';
        del.title = '删除这条记忆';
        del.textContent = '✕';
        del.addEventListener('click', () => deleteMemoryFact(f.id));
        row.appendChild(body); row.appendChild(del);
        group.appendChild(row);
      }
      $memoryPane.appendChild(group);
    }
  }

  async function loadMemoryFacts() {
    try {
      const resp = await fetch('/api/longterm_memory');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      renderMemoryFacts(await resp.json());
    } catch (e) {
      $memoryPane.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'ltm-empty';
      err.textContent = '加载记忆失败: ' + e.message;
      $memoryPane.appendChild(err);
    }
  }

  async function deleteMemoryFact(factId) {
    if (!factId || !confirm('删除这条长期记忆？')) return;
    try {
      const resp = await fetch('/api/longterm_memory/' + encodeURIComponent(factId), { method: 'DELETE' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      showToast('已删除');
      await loadMemoryFacts();
    } catch (e) {
      showToast('删除失败: ' + e.message, true);
    }
  }

  function openMemoryPanel() {
    memoryPrevFocus = document.activeElement;
    $memoryModal.hidden = false;
    document.body.classList.add('modal-open');
    $memoryModalClose.focus();
    loadMemoryFacts();
  }

  function closeMemoryPanel() {
    $memoryModal.hidden = true;
    document.body.classList.remove('modal-open');
    if (memoryPrevFocus && memoryPrevFocus.focus) memoryPrevFocus.focus();
  }

  $memoryBtn.addEventListener('click', openMemoryPanel);
  $memoryModalClose.addEventListener('click', closeMemoryPanel);
  $memoryModalRefresh.addEventListener('click', loadMemoryFacts);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$memoryModal.hidden) closeMemoryPanel();
  });

  init();
</script>
</body>
</html>
