<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简易聊天 Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #1f2328;
    --text-muted: #6b7280;
    --user-bg: #eef4ff;
    --ai-bg: #f7f7f8;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --code-bg: #f3f4f6;
    --status-bg: #fff7ed;
    --status-border: #fed7aa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .meta { color: var(--text-muted); font-size: 12px; margin-left: 8px; }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .reset-btn:hover { background: #f3f4f6; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    margin: auto;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
  }
  .msg {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.65;
    word-wrap: break-word;
    white-space: normal;
  }
  .msg.user {
    background: var(--user-bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    background: var(--ai-bg);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg p { margin: 0.4em 0; }
  .msg p:first-child { margin-top: 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 13px;
  }
  .msg code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.92em;
  }
  .msg :not(pre) > code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .msg ul, .msg ol { padding-left: 1.5em; margin: 0.4em 0; }
  .tool-strip {
    background: var(--status-bg);
    border: 1px solid var(--status-border);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: #92400e;
    font-family: ui-monospace, monospace;
  }
  .thinking-panel {
    background: #fafafa;
    border: 1px solid #ececec;
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: #555;
  }
  .thinking-panel summary {
    cursor: pointer;
    user-select: none;
    outline: none;
    list-style: none;
  }
  .thinking-panel summary::-webkit-details-marker { display: none; }
  .thinking-panel summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.15s;
  }
  .thinking-panel[open] summary::before { transform: rotate(90deg); }
  .thinking-panel[open] summary { margin-bottom: 6px; }
  .thinking-body {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 240px;
    overflow-y: auto;
    color: #666;
    line-height: 1.55;
    font-size: 12px;
  }
  .tool-strip[hidden], .thinking-panel[hidden] { display: none; }
  .thinking-placeholder { color: var(--text-muted); }
  .thinking-dots::after {
    display: inline-block;
    width: 1em;
    text-align: left;
    animation: dots 1.4s steps(4, end) infinite;
    content: '';
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea#input {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    min-height: 42px;
    max-height: 200px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea#input:focus { border-color: var(--primary); }
  textarea#input:disabled { background: #f9fafb; cursor: not-allowed; }
  button.send {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }
  button.send:hover:not(:disabled) { background: var(--primary-hover); }
  button.send:disabled { background: #cbd5e1; cursor: not-allowed; }
  .error-text { color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>简易聊天 Agent <span class="meta">ReAct · 流式 · 思考 · 联网</span></h1>
    </div>
    <button class="reset-btn" id="reset" title="清空当前会话的对话记忆">清空对话</button>
  </header>
  <div class="messages" id="messages">
    <div class="empty" id="empty">输入消息开始对话（Enter 发送，Shift+Enter 换行）</div>
  </div>
  <div class="input-bar">
    <textarea id="input" placeholder="说点什么..." rows="1"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</div>

<script>
  // ---------- session ----------
  let SESSION_ID = localStorage.getItem('sid');
  if (!SESSION_ID) {
    SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
    localStorage.setItem('sid', SESSION_ID);
  }

  // ---------- DOM ----------
  const $messages = document.getElementById('messages');
  const $empty = document.getElementById('empty');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $reset = document.getElementById('reset');

  // ---------- helpers ----------
  function autoResize() {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
  }
  function scrollToBottom() {
    $messages.scrollTop = $messages.scrollHeight;
  }
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
  function addMessage(role, initialHtml = '') {
    if ($empty) { $empty.remove(); }
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (role === 'ai') {
      // 三段结构：思考面板 / 工具状态条 / 回答正文
      div.innerHTML = `
        <details class="thinking-panel" open hidden>
          <summary>💭 思考中…</summary>
          <div class="thinking-body"></div>
        </details>
        <div class="tool-strip" hidden></div>
        <div class="answer-body">${initialHtml}</div>
      `;
    } else {
      div.innerHTML = initialHtml;
    }
    $messages.appendChild(div);
    scrollToBottom();
    return div;
  }
  function setStreaming(streaming) {
    $send.disabled = streaming;
    $input.disabled = streaming;
    $send.textContent = streaming ? '生成中...' : '发送';
  }
  function parseSSEBlock(block) {
    const ev = { event: 'message', data: null };
    for (const line of block.split('\n')) {
      if (line.startsWith('event:')) ev.event = line.slice(6).trim();
      else if (line.startsWith('data:')) {
        const raw = line.slice(5).trim();
        try { ev.data = JSON.parse(raw); } catch { ev.data = raw; }
      }
    }
    return ev;
  }

  // ---------- chat ----------
  async function send() {
    const text = $input.value.trim();
    if (!text || $send.disabled) return;

    addMessage('user', escapeHtml(text).replace(/\n/g, '<br>'));
    $input.value = '';
    autoResize();
    setStreaming(true);

    const aiDiv = addMessage('ai', '<span class="thinking-placeholder">思考中<span class="thinking-dots"></span></span>');
    const $think = aiDiv.querySelector('.thinking-panel');
    const $thinkBody = aiDiv.querySelector('.thinking-body');
    const $thinkSummary = aiDiv.querySelector('.thinking-panel summary');
    const $toolStrip = aiDiv.querySelector('.tool-strip');
    const $answer = aiDiv.querySelector('.answer-body');

    let answerBuf = '';
    let thinkBuf = '';
    let thinkStartTs = 0;
    let answeringFlipped = false;
    let answerStarted = false;

    function flipToAnswering() {
      if (answeringFlipped) return;
      answeringFlipped = true;
      if (thinkStartTs) {
        const elapsed = (Date.now() - thinkStartTs) / 1000;
        $think.open = false;
        $thinkSummary.textContent = `💭 思考过程（用时 ${elapsed.toFixed(1)} s）`;
      }
    }
    function appendAnswer(text) {
      if (!answerStarted) {
        answerStarted = true;
        $answer.innerHTML = '';
      }
      answerBuf += text;
      $answer.innerHTML = marked.parse(answerBuf);
      scrollToBottom();
    }
    function pushTool(label) {
      $toolStrip.hidden = false;
      $toolStrip.textContent = label;
    }

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, message: text }),
      });
      if (!resp.ok || !resp.body) throw new Error(`HTTP ${resp.status}`);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let raw = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        raw += decoder.decode(value, { stream: true });
        const blocks = raw.split('\n\n');
        raw = blocks.pop();
        for (const block of blocks) {
          if (!block.trim()) continue;
          const ev = parseSSEBlock(block);
          if (ev.event === 'thinking') {
            if (!thinkStartTs) {
              thinkStartTs = Date.now();
              $think.hidden = false;
              $think.open = true;
            }
            thinkBuf += (ev.data && ev.data.text) || '';
            $thinkBody.textContent = thinkBuf;
            $thinkBody.scrollTop = $thinkBody.scrollHeight;
            scrollToBottom();
          } else if (ev.event === 'chunk') {
            flipToAnswering();
            appendAnswer((ev.data && ev.data.text) || '');
          } else if (ev.event === 'status') {
            if (ev.data && ev.data.phase === 'answering') {
              flipToAnswering();
            }
          } else if (ev.event === 'tool_call') {
            pushTool(`🛠 调用工具: ${ev.data.name} ${JSON.stringify(ev.data.args)}`);
          } else if (ev.event === 'tool_result') {
            pushTool(`✓ 工具 ${ev.data.name} 已返回结果`);
          } else if (ev.event === 'error') {
            flipToAnswering();
            const msg = (ev.data && ev.data.message) || '未知错误';
            if (!answerStarted) {
              answerStarted = true;
              $answer.innerHTML = `<span class="error-text">⚠ ${escapeHtml(msg)}</span>`;
            } else {
              answerBuf += `\n\n**⚠ ${msg}**`;
              $answer.innerHTML = marked.parse(answerBuf);
            }
            scrollToBottom();
          } else if (ev.event === 'done') {
            if (!answerStarted) {
              $answer.innerHTML = '<span class="thinking-placeholder">(无内容)</span>';
            }
          }
        }
      }
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      flipToAnswering();
      $answer.innerHTML = `<span class="error-text">⚠ 网络错误: ${escapeHtml(msg)}</span>`;
    } finally {
      setStreaming(false);
      $input.focus();
    }
  }

  // ---------- events ----------
  $send.addEventListener('click', send);
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  $input.addEventListener('input', autoResize);
  $reset.addEventListener('click', async () => {
    try {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID }),
      });
    } catch (e) { /* 忽略 */ }
    $messages.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.id = 'empty';
    empty.textContent = '已清空对话。';
    $messages.appendChild(empty);
  });
  $input.focus();
</script>
</body>
</html>
