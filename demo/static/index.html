  function addPlanDecisionBubble(payload) {
    const div = document.createElement('div');
    div.className = 'msg hitl';
    const header = document.createElement('div');
    header.className = 'hitl-header';
    header.textContent = '计划步骤需要处理';
    div.appendChild(header);

    const msg = document.createElement('div');
    msg.className = 'hitl-question';
    msg.textContent = payload.error_message || '步骤执行失败';
    div.appendChild(msg);

    const editor = buildEditablePlanSteps(payload.steps || []);
    div.appendChild(editor);

    const actions = document.createElement('div');
    actions.className = 'hitl-actions';
    const makeBtn = (label, decision) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = decision === 'skip' ? 'hitl-btn hitl-reject' : 'hitl-btn hitl-submit';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (!canStartStream('计划恢复')) return;
        markHitlResolved(div, label);
        consumePlanDecisionStream({
          plan_id: payload.plan_id,
          step_id: payload.step_id,
          decision,
          steps: decision === 'update' ? collectPlanSteps(editor) : null,
        });
      });
      return btn;
    };
    actions.appendChild(makeBtn('跳过', 'skip'));
    actions.appendChild(makeBtn('重试', 'retry'));
    actions.appendChild(makeBtn('修改后继续', 'update'));
    div.appendChild(actions);
    $messages.appendChild(div);
    currentHitlBubble = div;
    scrollToBottom(true);
  }

  // ---------- HITL bubble ----------
  function addHitlBubble(payload) {
    if (payload.kind === 'plan') {
      upsertPlanCard({
        plan_id: payload.plan_id,
        title: payload.title,
        steps: payload.steps,
        editable: true,
        status: 'pending_confirmation',
      });
      return;
    }
    if (payload.kind === 'plan_decision') {
      addPlanDecisionBubble(payload);
      return;
    }
    const $emptyEl = document.getElementById('empty');
    if ($emptyEl) $emptyEl.remove();
    const div = document.createElement('div');
    div.className = 'msg hitl';
    div.dataset.toolCallId = payload.tool_call_id || '';
    div.dataset.kind = payload.kind || '';

    const args = payload.args || {};
    const isInput = payload.kind === 'input';

    // 头部:工具图标 + 标签 + "已处理" tag 占位
    const header = document.createElement('div');
    header.className = 'hitl-header';
    header.innerHTML = `${isInput ? '💬' : '⚠️'} <span>${isInput ? '需要你的回答' : '需要你的审批'}</span><span class="hitl-resolved-tag"></span>`;
    div.appendChild(header);

    if (isInput) {
      // ask_user:question + 可选 options chip + textarea + 提交按钮
      const q = document.createElement('div');
      q.className = 'hitl-question';
      q.textContent = args.question || '(无问题文本)';
      div.appendChild(q);

      const textarea = document.createElement('textarea');
      textarea.className = 'hitl-input';
      textarea.placeholder = '在此输入答复…(Cmd/Ctrl+Enter 提交)';

      const opts = Array.isArray(args.options) ? args.options : [];
      if (opts.length > 0) {
        const optsWrap = document.createElement('div');
        optsWrap.className = 'hitl-options';
        for (const o of opts) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'hitl-opt';
          chip.textContent = String(o);
          chip.addEventListener('click', () => {
            textarea.value = String(o);
            textarea.focus();
          });
          optsWrap.appendChild(chip);
        }
        div.appendChild(optsWrap);
      }
      div.appendChild(textarea);

      const actions = document.createElement('div');
      actions.className = 'hitl-actions';
      const submit = document.createElement('button');
      submit.type = 'button';
      submit.className = 'hitl-btn hitl-submit';
      submit.textContent = '提交答复';
      submit.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        const answer = textarea.value.trim();
        if (!answer) { textarea.focus(); return; }
        markHitlResolved(div, `已答复: ${answer.slice(0, 40)}${answer.length > 40 ? '…' : ''}`);
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'answer',
          answer,
        });
      });
      actions.appendChild(submit);
      div.appendChild(actions);

      textarea.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          submit.click();
        }
      });
      setTimeout(() => textarea.focus(), 0);
    } else {
      // execute_shell_command:命令 + 理由 + 同意/拒绝
      if (args.command) {
        const cmd = document.createElement('div');
        cmd.className = 'hitl-command';
        cmd.textContent = args.command;
        div.appendChild(cmd);
      }
      if (args.reason) {
        const reason = document.createElement('div');
        reason.className = 'hitl-reason';
        reason.textContent = `理由: ${args.reason}`;
        div.appendChild(reason);
      }

      // 可选拒绝理由 textarea(隐藏的,点拒绝时若想填可见)
      const rejectReason = document.createElement('textarea');
      rejectReason.className = 'hitl-input';
      rejectReason.placeholder = '可选:拒绝理由(模型会看到)';
      rejectReason.style.minHeight = '40px';
      div.appendChild(rejectReason);

      const actions = document.createElement('div');
      actions.className = 'hitl-actions';
      const approve = document.createElement('button');
      approve.type = 'button';
      approve.className = 'hitl-btn hitl-approve';
      approve.textContent = '✓ 同意执行';
      approve.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        markHitlResolved(div, '已同意');
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'approve',
          answer: null,
        });
      });
      const reject = document.createElement('button');
      reject.type = 'button';
      reject.className = 'hitl-btn hitl-reject';
      reject.textContent = '✗ 拒绝';
      reject.addEventListener('click', () => {
        if (!canStartStream('继续对话')) return;
        const reason = rejectReason.value.trim() || null;
        markHitlResolved(div, '已拒绝');
        consumeResumeStream({
          tool_call_id: payload.tool_call_id,
          decision: 'reject',
          answer: reason,
        });
      });
      actions.appendChild(reject);
      actions.appendChild(approve);
      div.appendChild(actions);
    }

    $messages.appendChild(div);
    currentHitlBubble = div;
    scrollToBottom(true);
  }

  // resume 流消费 —— 新建 aiDiv 承接 resume 后续(可能再触发 HITL,可能直接答复)
  async function consumeResumeStream(body) {
    if (!SESSION_ID) { showToast('会话未就绪,无法提交', true); return; }
    if (!canStartStream('继续对话')) return;
    setStreaming(true);
    const ctx = createAiStreamContext();
    try {
      const resp = await fetch('/api/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID, ...body }),
      });
      if (!resp.ok || !resp.body) {
        let detail = `HTTP ${resp.status}`;
        try { const j = await resp.json(); if (j && j.detail) detail += ` ${j.detail}`; } catch (e) { /* noop */ }
        throw new Error(detail);
      }
      await consumeStream(resp.body.getReader(), ctx);
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      ctx.flipToAnswering();
      ctx.$answer.innerHTML = `<span class="error-text">⚠ resume 失败: ${escapeHtml(msg)}</span>`;
    } finally {
      setStreaming(false);
      $input.focus();
    }
  }

  // ---------- events ----------
  $send.addEventListener('click', send);
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  $input.addEventListener('input', autoResize);
  $newSession.addEventListener('click', newSession);
  $archive.addEventListener('click', () => archiveCurrent(false));
  $copySid.addEventListener('click', copySessionId);
  $reset.addEventListener('click', async () => {
    if (!confirm('确认重置当前会话?(内存和归档都会被清空,session_id 保留)')) return;
    try {
      const resp = await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      showToast('已重置');
    } catch (e) {
      showToast('重置失败: ' + e.message, true);
    }
    currentHitlBubble = null;  // reset 会 innerHTML='',旧引用作废
    clearUiHint();
    clearRuntimeUiState();
    showEmptyPlaceholder('已清空对话。');
    await loadSessions();
  });

  // ---------- 首屏初始化 ----------
  async function init() {
    const stored = localStorage.getItem('sid');
    if (stored) {
      SESSION_ID = stored;
    } else {
      // 没缓存:看看 server 有没有归档,有就选最新一条;否则生成新 UUID
      let items = [];
      try {
        const resp = await fetch('/api/sessions');
        if (resp.ok) items = await resp.json();
      } catch (e) { /* 网络错就当作没归档 */ }
      if (items.length > 0) {
        SESSION_ID = items[0].session_id;
      } else {
        SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
      }
      localStorage.setItem('sid', SESSION_ID);
    }
    updateHeaderSid();
    clearAnchors();  // 兜底空态:loadHistory 内部分支会再次清/重建,无副作用
    await loadSessions();
    await loadHistory(SESSION_ID);
    $input.focus();
  }

  // ---------- 归档预览 modal ----------
  const $previewArchive       = document.getElementById('preview-archive');
  const $archiveModal         = document.getElementById('archive-modal');
  const $archiveModalSid      = document.getElementById('archive-modal-sid');
  const $archiveModalMeta     = document.getElementById('archive-modal-meta');
  const $archiveModalBody     = document.getElementById('archive-modal-body');
  const $archivePaneRendered  = document.getElementById('archive-pane-rendered');
  const $archivePaneSource    = document.getElementById('archive-pane-source');
  const $archiveSourceCode    = document.getElementById('archive-source-code');
  const $archiveModalClose    = document.getElementById('archive-modal-close');
  const $archiveModalCopy     = document.getElementById('archive-modal-copy');
  const $archiveModalDownload = document.getElementById('archive-modal-download');
  const $archiveModalTabs     = $archiveModal.querySelectorAll('.modal-tab');

  let archiveModalRaw = '';
  let archivePrevFocus = null;

  const ARCHIVE_META_RE = /^<!-- (session_id|updated_at|turns|preview): (.*?) -->\s*$/;
  const ARCHIVE_TURN_RE = /^<!-- turn: (用户|AI) -->\s*$/gm;

  function parseArchiveMarkdown(raw) {
    // 头部:第一个空行前的连续 HTML 注释为元信息
    const meta = {};
    for (const line of raw.split('\n')) {
      if (line.trim() === '') break;
      const m = line.match(ARCHIVE_META_RE);
      if (m) meta[m[1]] = m[2];
    }
    // turn 段:整行匹配 <!-- turn: 用户|AI -->,段落是相邻两个 turn header 之间的内容
    ARCHIVE_TURN_RE.lastIndex = 0;
    const matches = [];
    let mm;
    while ((mm = ARCHIVE_TURN_RE.exec(raw)) !== null) {
      matches.push({ role: mm[1], headerEnd: mm.index + mm[0].length, headerStart: mm.index });
    }
    const turns = [];
    for (let i = 0; i < matches.length; i++) {
      const start = matches[i].headerEnd;
      const end = i + 1 < matches.length ? matches[i + 1].headerStart : raw.length;
      const content = raw.slice(start, end).trim();
      if (content) turns.push({ role: matches[i].role, content });
    }
    return { meta, turns };
  }

  function renderArchive(raw) {
    const { meta, turns } = parseArchiveMarkdown(raw);
    $archivePaneRendered.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'archive-meta-card';
    for (const [k, v] of [
      ['session_id', meta.session_id || '-'],
      ['updated_at', meta.updated_at || '-'],
      ['turns',      meta.turns      || '0'],
    ]) {
      const span = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = k + ':';
      span.appendChild(b);
      span.appendChild(document.createTextNode(' ' + v));
      card.appendChild(span);
    }
    $archivePaneRendered.appendChild(card);
    for (const t of turns) {
      const article = document.createElement('article');
      article.className = 'archive-turn ' + (t.role === '用户' ? 'archive-turn-user' : 'archive-turn-ai');
      const h = document.createElement('h3');
      h.textContent = t.role;
      article.appendChild(h);
      const body = document.createElement('div');
      body.className = 'archive-content';
      if (t.role === '用户') {
        // 用户原文不走 markdown,与聊天主区行为一致(防 XSS)
        const p = document.createElement('div');
        p.className = 'archive-user-text';
        p.textContent = t.content;
        body.appendChild(p);
      } else {
        body.innerHTML = renderMarkdown(t.content);
      }
      article.appendChild(body);
      $archivePaneRendered.appendChild(article);
    }
    renderMermaidIn($archivePaneRendered);  // 渲染 Tab 内的 mermaid 块异步替换为 SVG
    $archiveSourceCode.textContent = raw;
    const sid = meta.session_id || SESSION_ID || '';
    $archiveModalSid.textContent = sid.slice(0, 8) || '-';
    $archiveModalSid.title = sid;
    $archiveModalMeta.textContent = `轮数 ${meta.turns || 0} · 更新 ${meta.updated_at || '?'}`;
  }

  function renderArchiveEmptyState() {
    $archivePaneRendered.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'archive-empty';
    const p = document.createElement('p');
    p.textContent = '本会话尚未归档,暂无可预览的 markdown 文件。';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reset-btn';
    btn.textContent = '立即归档';
    btn.addEventListener('click', async () => {
      await archiveCurrent();
      await openArchivePreview();
    });
    div.appendChild(p);
    div.appendChild(btn);
    $archivePaneRendered.appendChild(div);
    $archiveSourceCode.textContent = '';
    $archiveModalSid.textContent = (SESSION_ID || '').slice(0, 8) || '-';
    $archiveModalSid.title = SESSION_ID || '';
    $archiveModalMeta.textContent = '尚未归档';
  }

  function switchArchiveTab(tab) {
    for (const t of $archiveModalTabs) t.classList.toggle('active', t.dataset.tab === tab);
    $archivePaneRendered.hidden = (tab !== 'rendered');
    $archivePaneSource.hidden   = (tab !== 'source');
    $archiveModalBody.scrollTop = 0;
  }

  async function openArchivePreview() {
    if (!SESSION_ID) { showToast('会话未就绪', true); return; }
    let raw = '', archived = false;
    try {
      const resp = await fetch(`/api/sessions/${encodeURIComponent(SESSION_ID)}/raw`);
      if (resp.status === 404)      archived = false;
      else if (!resp.ok)            throw new Error(`HTTP ${resp.status}`);
      else { raw = await resp.text(); archived = true; }
    } catch (e) {
      showToast('加载归档失败: ' + e.message, true);
      return;
    }
    archiveModalRaw = raw;
    if (archived) renderArchive(raw); else renderArchiveEmptyState();
    switchArchiveTab('rendered');
    archivePrevFocus = document.activeElement;
    $archiveModal.hidden = false;
    document.body.classList.add('modal-open');
    $archiveModalClose.focus();
  }

  function closeArchivePreview() {
    $archiveModal.hidden = true;
    document.body.classList.remove('modal-open');
    if (archivePrevFocus && archivePrevFocus.focus) archivePrevFocus.focus();
  }

  $previewArchive.addEventListener('click', openArchivePreview);
  $archiveModalClose.addEventListener('click', closeArchivePreview);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$archiveModal.hidden) closeArchivePreview();
  });
  for (const t of $archiveModalTabs) {
    t.addEventListener('click', () => switchArchiveTab(t.dataset.tab));
  }
  $archiveModalCopy.addEventListener('click', async () => {
    if (!archiveModalRaw) { showToast('暂无内容可复制', true); return; }
    try { await navigator.clipboard.writeText(archiveModalRaw); showToast('已复制源文件'); }
    catch (e) { showToast('复制失败', true); }
  });
  $archiveModalDownload.addEventListener('click', () => {
    if (!archiveModalRaw) { showToast('暂无内容可下载', true); return; }
    const blob = new Blob([archiveModalRaw], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(SESSION_ID || 'session').slice(0, 8)}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 200);
  });

  init();
</script>
</body>
</html>
